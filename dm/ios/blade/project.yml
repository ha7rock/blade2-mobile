# Blade II（通用宿主）的 iOS 工程：XcodeGen 输入，run.sh build 每次重新生成 BladeIOS.xcodeproj 与 Gen/。
# 与 ../project.yml（暗黑）的差别：宿主源文件取自 dm/host/Makefile.blade（通用部分 + blade_stubs.c + hle_*.c，不带任何 dm_*.c 暗黑功能文件），
# 外壳只有两个文件（Sources/main.m 启动与找资源、Sources/front_blade.m Metal 视图 + 通用虚拟手柄），没有覆盖层 RomFS、资源下载扩展、iCloud、界面测试。
# iOS project for Blade II (generic host): XcodeGen input; run.sh build regenerates BladeIOS.xcodeproj and Gen/ every time.
# Differences from ../project.yml (Diablo): host sources come from dm/host/Makefile.blade (generic part + blade_stubs.c + hle_*.c, no Diablo dm_*.c feature files),
# the shell is just two files (Sources/main.m launch and asset lookup, Sources/front_blade.m Metal view + generic virtual gamepad); no overlay RomFS, asset download extension, iCloud or UI tests.
name: BladeIOS
options:
  bundleIdPrefix: ${DM_BUNDLE_ID}
  deploymentTarget:
    iOS: "26.0"   # 图形后端建在 Metal 4 上（同暗黑工程） | The graphics backend is built on Metal 4 (same as the Diablo project)
configFiles:                     # run.sh build 生成：内嵌段链接参数 + 从 Makefile.blade 取的头文件路径、-D 与框架 | Generated by run.sh build: embedded-segment link flags + header paths, -D and frameworks taken from Makefile.blade
  Release: Gen/dm.xcconfig
  Debug: Gen/dm.xcconfig
targets:
  BladeII:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets               # 占位图标（不是游戏素材） | Placeholder icon (not a game asset)
      - path: Gen/embed.S             # main / sdk 改写映像（gen_embed.py；main 的补丁区在映像前面） | main / sdk rewritten images (gen_embed.py; main's patch area lies before the image)
      - path: Gen/dm                  # 装载表头 / 门表 / 剪口表 / 着色器映射表（App 内 dm/ = 宿主的「产物目录」） | Load table headers / gate tables / cut table / shader map (dm/ inside the App = the host's "build output dir")
        type: folder
        buildPhase: resources
      - path: Gen/msl                 # iOS 版 metallib + 反射 json（DM_MSL_DIR；只带当前翻译链版本 b-<V>） | iOS metallib + reflection json (DM_MSL_DIR; only the current chain version b-<V>)
        type: folder
        buildPhase: resources
      - path: Gen/src                 # Makefile.blade 编译命令里的源文件（gen_build.py 链入） | Source files from the Makefile.blade compile command (linked in by gen_build.py)
      - path: Gen/main/main.c
        compilerFlags: "-Dmain=dm_main"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Blade II
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchStoryboardName: ""
        UIFileSharingEnabled: true                 # 玩家把 RomFS（BladeII/ 文件夹）用「文件」App 拷进 Documents | Players copy the RomFS (BladeII/ folder) into Documents with the Files app
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:          # 游戏只渲 1280x720 横屏 | The game only renders 1280x720 landscape
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        LSApplicationCategoryType: public.app-category.action-games
        LSSupportsGameMode: true
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: SceneDelegate
    entitlements:
      path: Sources/BladeII.entitlements
      properties:
        # 物理内存上限：游戏把 3650 MB 的堆整块交给自己的分配器，进局后常驻按 GB 计；不带这项的话 8 GB 机型上限约 5 GB 内，带上更宽
        # Physical memory limit: the game hands its allocator a single 3650 MB heap and resident memory in a level is measured in GB; without this the cap on 8 GB devices is about 5 GB, with it wider
        com.apple.developer.kernel.increased-memory-limit: true
        # 虚拟地址：宿主整块预留 5 GB（DM_SYSRES_MB=0 → UE4 走普通堆路线，不要 16 GB 地址区，见 dm/host/hle_svc.c），不签这项也放得下（iOS 不带它单次最多 6 GB）。
        # 留着是为了 Metal 资源与贴图上传的地址余量；免费账号签不了时可以删掉这一行
        # Virtual address space: the host reserves 5 GB in one block (DM_SYSRES_MB=0 → UE4 takes the plain heap route and needs no 16 GB region, see dm/host/hle_svc.c), which fits without this entitlement (at most 6 GB in one reservation on iOS without it).
        # Kept for address headroom for Metal resources and texture uploads; delete this line if a free account cannot sign it
        com.apple.developer.kernel.extended-virtual-addressing: true
        com.apple.developer.sustained-execution: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${DM_BUNDLE_ID}
      DEVELOPMENT_TEAM: ${DM_TEAM_ID}
      CODE_SIGN_STYLE: Automatic
      MARKETING_VERSION: "0.1"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1,2"
      ENABLE_BITCODE: NO
      ENABLE_DEBUG_DYLIB: NO   # Debug 缺省把 App 拆成壳 + 调试 dylib（Xcode 预览用），内嵌映像段与 _mh_execute_header 就不在主可执行文件里了 | Debug by default splits the App into a stub + debug dylib (for Xcode previews), which moves the embedded image sections and _mh_execute_header out of the main executable
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      GCC_C_LANGUAGE_STANDARD: gnu11
      OTHER_CFLAGS: $(inherited) -mcpu=apple-a13   # 宿主汇编里有 LSE 原子指令，默认 a10 基线不认；A13 = 能装 iOS 26 的最老芯片 | The host assembly contains LSE atomics that the default a10 baseline rejects; A13 = the oldest chip that runs iOS 26
      CLANG_ENABLE_OBJC_ARC: YES
      DEBUG_INFORMATION_FORMAT: dwarf
      GCC_WARN_UNUSED_FUNCTION: NO
schemes:
  BladeII:
    build:
      targets:
        BladeII: all
